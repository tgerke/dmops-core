# Governed metric definition (ADR-0004; DS starter set, ADR-0012).
id: pr_cycle_time_median
label: PR cycle time (median)
owner: Statistical Programming
module: stat
version: "1.0"
grain: [study]
definition: >
  Median elapsed business days from pull request opened to merged, across
  pull requests merged within the reporting period. Open pull requests and
  pull requests closed without merging never enter; the clock starts at pull
  request creation even when that predates the period. Business days are
  Monday through Friday by UTC date, the same rule as query_tat_median v1.1;
  no holiday calendar.
clock_start: pull_requests.opened_at
clock_stop: pull_requests.merged_at
calendar: business_days
include:
  - pull requests merged in the period
exclude:
  - open pull requests
  - pull requests closed without merging
source_frames: [pull_requests]
required_fields:
  pull_requests: [state, opened_at, merged_at]
refresh: daily
target: "<= 5 business days"
