# Governed metric definition (ADR-0004; training and access mirrors, ADR-0013).
# Needs one source covering both frames (ADR-0013): in split deployments —
# access from the EDC, training from an LMS — this reports unavailable with
# the named gap, and the roster view answers the question live instead.
id: access_training_gap
label: Active access with a training gap
owner: DM Operations
version: "1.0"
grain: [study]
definition: >
  Count of persons holding at least one active access grant at period end
  whose training shows a gap as of period end - a required assignment (due
  by period end, or undated) not completed, a completion expired, or no
  training on file at all. The denominator is all persons with an active
  grant at period end; locked and deactivated accounts are excluded, and
  assignments due after period end create no gap.
clock_start: access_grants.granted_at
clock_stop: period_end
calendar: calendar_days
include:
  - persons with an active access grant at period end
exclude:
  - locked or deactivated accounts
  - assignments due after period end
source_frames: [access_grants, training_records]
required_fields:
  access_grants: [person_key, status, granted_at]
  training_records: [person_key, due_date, completed_date, expires_date]
refresh: daily
target: "0"
