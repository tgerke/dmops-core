# Host port 5434: edc-core takes 5432 and ctms-core 5433, so all three
# sibling stacks can run on one machine.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dmops
      POSTGRES_PASSWORD: dmops
      POSTGRES_DB: dmops
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmops"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
